{% extends "base.html" %}
{% block content %}
<h1>Signal Monitor</h1>
<p>Fetch recent SEC filings for a ticker and extract structured guidance/margin/sentiment signals.</p>

<form method="POST" id="monitor-form">
  <label>Ticker
    <input type="text" name="ticker" placeholder="e.g. AAPL" required>
  </label>

  <label class="checkbox">
    <input type="checkbox" name="use_sample">
    Use sample filing instead of live EDGAR fetch (useful if network access to sec.gov is restricted)
  </label>

  <button type="submit" id="monitor-submit-btn">Run Signal Extraction</button>
  <p id="monitor-status" class="status-message" hidden>
    Fetching filings and extracting signals — this can take up to a minute for multiple filings…
  </p>
</form>

<script>
  document.getElementById("monitor-form").addEventListener("submit", function () {
    var btn = document.getElementById("monitor-submit-btn");
    btn.disabled = true;
    btn.textContent = "Running…";
    document.getElementById("monitor-status").hidden = false;
  });
</script>
{% endblock %}
